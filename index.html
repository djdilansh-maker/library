<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - Emmanuel</title>
    <!-- Tailwind CSS for Professional UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-blue-900 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-wider">Emmanuel Senior Secondary School</h1>
                <p class="text-sm text-blue-200">Library Management System</p>
            </div>
            <div class="hidden md:block">
                <span class="bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold">Admin Panel</span>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mx-auto mt-8 p-4">
        
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 fade-in">
            <div class="bg-white p-6 rounded-lg shadow border-t-4 border-blue-600">
                <h3 class="text-gray-500 text-sm uppercase font-bold">Total Books</h3>
                <p class="text-3xl font-bold text-blue-900 mt-2" id="totalBooksCount">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Add Book Form -->
            <div class="bg-white p-6 rounded-lg shadow-md lg:col-span-1 fade-in">
                <h2 class="text-xl font-bold text-gray-700 border-b pb-2 mb-4">Add New Book</h2>
                <form id="addBookForm" onsubmit="addBook(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Book Title</label>
                        <input type="text" id="bookTitle" required class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Author Name</label>
                        <input type="text" id="bookAuthor" required class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Total Copies</label>
                        <input type="number" id="bookCopies" min="1" required class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition duration-200">
                        Add Book to Database
                    </button>
                </form>
            </div>

            <!-- Book List Table -->
            <div class="bg-white p-6 rounded-lg shadow-md lg:col-span-2 fade-in" style="animation-delay: 0.2s;">
                <h2 class="text-xl font-bold text-gray-700 border-b pb-2 mb-4">Available Books Database</h2>
                <div class="overflow-x-auto">
                    <table class="w-full table-auto border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 uppercase text-sm leading-normal">
                                <th class="py-3 px-4 text-left border">ID</th>
                                <th class="py-3 px-4 text-left border">Book Title</th>
                                <th class="py-3 px-4 text-left border">Author</th>
                                <th class="py-3 px-4 text-center border">Available Copies</th>
                                <th class="py-3 px-4 text-center border">Action</th>
                            </tr>
                        </thead>
                        <tbody id="booksTableBody" class="text-gray-600 text-sm font-light">
                            <!-- Books will be injected here via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic (Simulating Database with LocalStorage) -->
    <script>
        // Load data from LocalStorage or start with empty array
        let books = JSON.parse(localStorage.getItem('library_books')) || [];

        // Function to update the table
        function renderBooks() {
            const tbody = document.getElementById('booksTableBody');
            const totalCount = document.getElementById('totalBooksCount');
            tbody.innerHTML = '';
            
            let total = 0;

            books.forEach((book, index) => {
                total += parseInt(book.copies);
                const row = `<tr class="border-b border-gray-200 hover:bg-gray-50">
                    <td class="py-3 px-4 text-left border">10${index + 1}</td>
                    <td class="py-3 px-4 text-left font-semibold text-gray-800 border">${book.title}</td>
                    <td class="py-3 px-4 text-left border">${book.author}</td>
                    <td class="py-3 px-4 text-center font-bold text-green-600 border">${book.copies}</td>
                    <td class="py-3 px-4 text-center border">
                        <button onclick="deleteBook(${index})" class="bg-red-500 text-white px-3 py-1 rounded text-xs hover:bg-red-600">Delete</button>
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });

            totalCount.innerText = total;
            
            // Save to LocalStorage
            localStorage.setItem('library_books', JSON.stringify(books));
        }

        // Function to add a book
        function addBook(e) {
            e.preventDefault(); // Prevent page reload
            
            const title = document.getElementById('bookTitle').value;
            const author = document.getElementById('bookAuthor').value;
            const copies = document.getElementById('bookCopies').value;

            // Add to array
            books.push({ title, author, copies });
            
            // Clear form
            document.getElementById('addBookForm').reset();
            
            // Re-render table
            renderBooks();
            alert("Book added successfully!");
        }

        // Function to delete a book
        function deleteBook(index) {
            if(confirm("Are you sure you want to delete this book?")) {
                books.splice(index, 1);
                renderBooks();
            }
        }

        // Initial render on page load
        window.onload = renderBooks;
    </script>
</body>
</html>
