<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - Emmanuel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-wider">Emmanuel Senior Secondary School</h1>
            <p class="text-xs text-blue-200">Library Management System</p>
        </div>
        <div id="navButtons" class="hidden space-x-2">
            <button onclick="showSection('dashboard')" class="bg-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-600">Home</button>
            <button onclick="showSection('addBookSection')" class="bg-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-600">Add Book</button>
            <button onclick="showSection('studentsSection')" class="bg-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-600">Register Student</button>
            <button onclick="showSection('issueSection')" class="bg-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-600">Issue/Return</button>
            <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded text-sm hover:bg-red-600 font-bold">8. Exit (Logout)</button>
        </div>
    </nav>

    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen" class="container mx-auto mt-20 flex justify-center fade-in">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-sm border-t-4 border-blue-900">
            <h2 class="text-2xl font-bold text-center mb-6">Admin Login</h2>
            <form onsubmit="login(event)">
                <input type="text" id="username" required placeholder="Admin ID (admin)" class="w-full mb-4 p-2 border rounded">
                <input type="password" id="password" required placeholder="Password (admin)" class="w-full mb-6 p-2 border rounded">
                <button type="submit" class="w-full bg-blue-900 text-white font-bold py-2 rounded hover:bg-blue-800">Login</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="mainApp" class="container mx-auto mt-6 p-4 hidden">
        
        <!-- 2. & 3. DISPLAY & SEARCH BOOKS (DASHBOARD) -->
        <div id="dashboard" class="fade-in">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-gray-700">2. Available Books</h2>
                <input type="text" id="searchInput" onkeyup="searchBooks()" placeholder="3. Search by Title/ID..." class="p-2 border rounded w-64 shadow-sm">
            </div>
            <div class="bg-white p-4 rounded-lg shadow overflow-x-auto">
                <table class="w-full table-auto border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700 text-left">
                            <th class="p-3 border">Book ID</th>
                            <th class="p-3 border">Title</th>
                            <th class="p-3 border">Author</th>
                            <th class="p-3 border">Available Copies</th>
                        </tr>
                    </thead>
                    <tbody id="booksTableBody"></tbody>
                </table>
            </div>
            
            <!-- 7. VIEW ISSUE RECORDS -->
            <h2 class="text-2xl font-bold text-gray-700 mt-8 mb-4">7. View Issue Records</h2>
            <div class="bg-white p-4 rounded-lg shadow overflow-x-auto">
                <table class="w-full table-auto border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700 text-left">
                            <th class="p-3 border">Issue ID</th>
                            <th class="p-3 border">Book ID</th>
                            <th class="p-3 border">Student ID</th>
                            <th class="p-3 border">Status</th>
                        </tr>
                    </thead>
                    <tbody id="issueRecordsTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 1. ADD BOOK SECTION -->
        <div id="addBookSection" class="hidden fade-in bg-white p-6 rounded-lg shadow max-w-lg mx-auto">
            <h2 class="text-xl font-bold mb-4">1. Add New Book</h2>
            <form onsubmit="addBook(event)">
                <input type="text" id="bookTitle" required placeholder="Book Title" class="w-full mb-3 p-2 border rounded">
                <input type="text" id="bookAuthor" required placeholder="Author Name" class="w-full mb-3 p-2 border rounded">
                <input type="number" id="bookCopies" min="1" required placeholder="Total Copies" class="w-full mb-4 p-2 border rounded">
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">Add Book</button>
            </form>
        </div>

        <!-- 4. REGISTER STUDENT -->
        <div id="studentsSection" class="hidden fade-in bg-white p-6 rounded-lg shadow max-w-lg mx-auto">
            <h2 class="text-xl font-bold mb-4">4. Register Student</h2>
            <form onsubmit="registerStudent(event)">
                <input type="text" id="studentName" required placeholder="Student Name" class="w-full mb-3 p-2 border rounded">
                <input type="text" id="studentClass" required placeholder="Class & Section (e.g. 12-A)" class="w-full mb-4 p-2 border rounded">
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">Register Student</button>
            </form>
            <div class="mt-6 border-t pt-4">
                <h3 class="font-bold text-gray-600 mb-2">Registered Students</h3>
                <ul id="studentList" class="text-sm list-disc pl-5"></ul>
            </div>
        </div>

        <!-- 5 & 6. ISSUE / RETURN BOOK -->
        <div id="issueSection" class="hidden fade-in grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Issue -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-bold mb-4 text-orange-600">5. Issue Book</h2>
                <form onsubmit="issueBook(event)">
                    <input type="number" id="issueBookId" required placeholder="Book ID" class="w-full mb-3 p-2 border rounded">
                    <input type="number" id="issueStudentId" required placeholder="Student ID" class="w-full mb-4 p-2 border rounded">
                    <button type="submit" class="w-full bg-orange-500 text-white font-bold py-2 rounded hover:bg-orange-600">Issue Book</button>
                </form>
            </div>
            <!-- Return -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-bold mb-4 text-green-600">6. Return Book</h2>
                <form onsubmit="returnBook(event)">
                    <input type="number" id="returnIssueId" required placeholder="Issue Record ID" class="w-full mb-4 p-2 border rounded">
                    <button type="submit" class="w-full bg-green-500 text-white font-bold py-2 rounded hover:bg-green-600">Return Book</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Database simulation using LocalStorage
        let books = JSON.parse(localStorage.getItem('lib_books')) || [];
        let students = JSON.parse(localStorage.getItem('lib_students')) || [];
        let issues = JSON.parse(localStorage.getItem('lib_issues')) || [];

        function saveData() {
            localStorage.setItem('lib_books', JSON.stringify(books));
            localStorage.setItem('lib_students', JSON.stringify(students));
            localStorage.setItem('lib_issues', JSON.stringify(issues));
            renderAll();
        }

        // --- Auth ---
        function login(e) {
            e.preventDefault();
            if(document.getElementById('username').value === 'admin' && document.getElementById('password').value === '1234') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('navButtons').classList.remove('hidden');
                renderAll();
            } else { alert("Wrong credentials!"); }
        }
        function logout() { location.reload(); }

        // --- Navigation ---
        function showSection(id) {
            ['dashboard', 'addBookSection', 'studentsSection', 'issueSection'].forEach(sec => {
                document.getElementById(sec).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
        }

        // --- 1. Add Book ---
        function addBook(e) {
            e.preventDefault();
            books.push({
                id: books.length > 0 ? books[books.length-1].id + 1 : 101,
                title: document.getElementById('bookTitle').value,
                author: document.getElementById('bookAuthor').value,
                copies: parseInt(document.getElementById('bookCopies').value)
            });
            e.target.reset();
            saveData();
            alert("Book Added!");
        }

        // --- 4. Register Student ---
        function registerStudent(e) {
            e.preventDefault();
            students.push({
                id: students.length > 0 ? students[students.length-1].id + 1 : 1,
                name: document.getElementById('studentName').value,
                cls: document.getElementById('studentClass').value
            });
            e.target.reset();
            saveData();
            alert("Student Registered!");
        }

        // --- 5. Issue Book ---
        function issueBook(e) {
            e.preventDefault();
            let bId = parseInt(document.getElementById('issueBookId').value);
            let sId = parseInt(document.getElementById('issueStudentId').value);
            
            let bookIndex = books.findIndex(b => b.id === bId);
            if(bookIndex === -1) return alert("Book not found!");
            if(books[bookIndex].copies < 1) return alert("No copies available!");
            if(!students.find(s => s.id === sId)) return alert("Student not registered!");

            books[bookIndex].copies -= 1;
            issues.push({
                id: issues.length > 0 ? issues[issues.length-1].id + 1 : 5001,
                bId: bId, sId: sId, status: 'Issued'
            });
            e.target.reset();
            saveData();
            alert("Book Issued Successfully!");
        }

        // --- 6. Return Book ---
        function returnBook(e) {
            e.preventDefault();
            let iId = parseInt(document.getElementById('returnIssueId').value);
            let issueIndex = issues.findIndex(i => i.id === iId);
            
            if(issueIndex === -1) return alert("Issue Record not found!");
            if(issues[issueIndex].status === 'Returned') return alert("Already returned!");

            issues[issueIndex].status = 'Returned';
            let bookIndex = books.findIndex(b => b.id === issues[issueIndex].bId);
            if(bookIndex !== -1) books[bookIndex].copies += 1;

            e.target.reset();
            saveData();
            alert("Book Returned Successfully!");
        }

        // --- 2, 3, 7. Display, Search & View Records ---
        function renderAll() {
            // Render Books
            const search = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : "";
            const tbody = document.getElementById('booksTableBody');
            tbody.innerHTML = '';
            books.filter(b => b.title.toLowerCase().includes(search) || b.id.toString().includes(search)).forEach(b => {
                tbody.innerHTML += `<tr class="border-b"><td class="p-3 border">${b.id}</td><td class="p-3 border font-semibold">${b.title}</td><td class="p-3 border">${b.author}</td><td class="p-3 border text-green-600 font-bold">${b.copies}</td></tr>`;
            });

            // Render Students
            const sList = document.getElementById('studentList');
            sList.innerHTML = '';
            students.forEach(s => sList.innerHTML += `<li>ID: ${s.id} | Name: ${s.name} (${s.cls})</li>`);

            // Render Issues
            const iBody = document.getElementById('issueRecordsTableBody');
            iBody.innerHTML = '';
            issues.slice().reverse().forEach(i => {
                let color = i.status === 'Issued' ? 'text-orange-500' : 'text-green-500';
                iBody.innerHTML += `<tr class="border-b"><td class="p-3 border">${i.id}</td><td class="p-3 border">${i.bId}</td><td class="p-3 border">${i.sId}</td><td class="p-3 border font-bold ${color}">${i.status}</td></tr>`;
            });
        }

        function searchBooks() { renderAll(); }
    </script>
</body>
</html>
